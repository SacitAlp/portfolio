<style>
:root{
  --bg:#E9ECE6;
  --panel:#F6F7F3;
  --panel-border:#C7CCC0;
  --ink:#22271F;
  --teal:#1F6F5C;
  --rust:#8A4A34;
  --steel:#5B6154;
  --white:#F6F7F3;
  --radius:2px;
}

*{ box-sizing:border-box; margin:0; padding:0; }

body{
  background: var(--bg);
  color: var(--ink);
  font-family:'Source Serif 4', serif;
  overflow-x:hidden;
}

a{ color:inherit; text-decoration:none; }

/* NAV */
nav{
  display:flex; justify-content:space-between; align-items:center;
  padding: 20px 48px;
  border-bottom: 1.5px solid var(--ink);
  position:sticky; top:0;
  background: var(--bg);
  z-index: 50;
}
nav .logo{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:16px;
}
nav .logo span{ color: var(--teal); }
nav .navlinks{
  display:flex; align-items:center; gap:30px;
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px;
  color: var(--steel);
  text-transform:uppercase;
  letter-spacing:0.06em;
}
nav .navlinks a:hover{ color: var(--ink); }
.lang-btn{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  background:transparent;
  border:1px solid var(--panel-border);
  color: var(--ink);
  padding:6px 12px;
  cursor:pointer;
  letter-spacing:0.06em;
}
.lang-btn:hover{ border-color: var(--teal); color: var(--teal); }

/* STATUS STRIP */
.status-strip{
  display:flex;
  border-bottom: 1px solid var(--panel-border);
  overflow:hidden;
  white-space:nowrap;
}
.status-strip .track{ display:flex; animation: scroll 22s linear infinite; }
.status-strip .item{
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px;
  color: var(--steel);
  padding: 10px 28px;
  border-right: 1px solid var(--panel-border);
  display:flex; align-items:center; gap:8px;
}
.status-strip .dot{ width:6px; height:6px; border-radius:50%; background: var(--teal); }
@keyframes scroll{ 0%{transform:translateX(0);} 100%{transform:translateX(-50%);} }

/* HERO */
.hero{
  padding: 90px 48px 60px;
  display:grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 50px;
  align-items:end;
}
.eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  color: var(--teal);
  letter-spacing:0.08em;
  text-transform:uppercase;
  margin-bottom:20px;
}
h1{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size: 56px;
  line-height:1.06;
  letter-spacing:-0.01em;
  margin-bottom:26px;
}
h1 .accent{ font-style:italic; color: var(--teal); font-weight:500; }
p.lead{
  font-size:16.5px;
  line-height:1.7;
  color: var(--steel);
  max-width:460px;
  margin-bottom:34px;
}
.ctas{ display:flex; gap:18px; align-items:center; }
.btn{
  display:inline-block;
  font-family:'IBM Plex Mono', monospace;
  font-size:12.5px;
  padding:14px 24px;
  background: var(--ink);
  color: var(--white);
  font-weight:500;
  border:none;
  cursor:pointer;
  letter-spacing:0.03em;
}
.btn.ghost{
  background:transparent;
  color: var(--ink);
  border-bottom:1px solid var(--ink);
  padding: 0 0 3px;
}
.btn:hover{ opacity:0.82; }

/* KPI GRID + RADIAL TRIGGERS */
.kpis{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:1px;
  background: var(--panel-border);
  border:1px solid var(--panel-border);
}
.kpi{
  background: var(--panel);
  padding: 26px 22px;
  cursor: pointer;
  position:relative;
  transition: background 0.15s ease;
}
.kpi:hover{ background:#EFF1EA; }
.kpi .num{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:36px;
  color: var(--ink);
}
.kpi .num span{ color: var(--teal); font-size:19px; }
.kpi .label{
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px;
  color: var(--steel);
  text-transform:uppercase;
  letter-spacing:0.06em;
  margin-top:6px;
}
.kpi.has-menu::after{
  content:"⊕";
  position:absolute;
  top:14px; right:16px;
  font-size:12px;
  color: var(--rust);
}

/* RADIAL MENU */
.radial-overlay{
  position:fixed; inset:0;
  background: rgba(34,39,31,0.35);
  backdrop-filter: blur(2px);
  opacity:0; pointer-events:none;
  transition: opacity 0.18s ease;
  z-index: 90;
}
.radial-overlay.active{ opacity:1; pointer-events:auto; }

.radial-menu{
  position:fixed;
  width: 0; height:0;
  z-index: 100;
  pointer-events:none;
}
.radial-menu.active{ pointer-events:auto; }

.radial-center{
  position:absolute;
  width:64px; height:64px;
  left:-32px; top:-32px;
  border-radius:50%;
  background: var(--teal);
  color: var(--white);
  display:flex; align-items:center; justify-content:center;
  font-family:'IBM Plex Mono', monospace;
  font-size:10px;
  text-align:center;
  font-weight:500;
  transform: scale(0);
  transition: transform 0.22s cubic-bezier(.2,1.4,.4,1);
}
.radial-menu.active .radial-center{ transform: scale(1); }

.radial-item{
  position:absolute;
  left:0; top:0;
  width:150px;
  --tx: 0px; --ty: 0px;
  transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0);
  opacity:0;
  transition: transform 0.24s cubic-bezier(.2,1.4,.4,1), opacity 0.18s ease;
  text-align:center;
}
.radial-menu.active .radial-item{
  transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1);
  opacity:1;
}

.radial-item .ri-inner{
  background: var(--panel);
  border: 1px solid var(--panel-border);
  padding: 12px 14px;
  cursor:pointer;
}
.radial-item .ri-inner:hover{
  border-color: var(--teal);
  background:#EFF1EA;
}
.radial-item .ri-tag{
  font-family:'IBM Plex Mono', monospace;
  font-size:9.5px;
  color: var(--rust);
  text-transform:uppercase;
  letter-spacing:0.06em;
  margin-bottom:4px;
}
.radial-item .ri-title{
  font-family:'Source Serif 4', serif;
  font-size:13px;
  font-weight:500;
  color: var(--ink);
  line-height:1.3;
}
.radial-line{
  position:absolute;
  height:1px;
  background: var(--panel-border);
  transform-origin: 0 0;
  z-index:-1;
  opacity:0;
  transition: opacity 0.18s ease;
}
.radial-menu.active .radial-line{ opacity:1; }

/* PROJECT GRID */
.projects{ padding: 80px 48px; }
.projects h2, .hobby-teaser h2, .cv-section h2{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:26px;
  margin-bottom: 36px;
  letter-spacing:-0.01em;
}
.project-grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1px;
  background: var(--panel-border);
  border: 1px solid var(--panel-border);
}
.project-card{
  background: var(--panel);
  padding: 26px;
  scroll-margin-top: 100px;
  border-left: 3px solid transparent;
  transition: border-color 0.3s ease, background 0.15s ease;
  display: block;
}
.project-card:hover{
  background:#EFF1EA;
  border-left-color: var(--teal);
}
.project-card .pc-tag{
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px;
  color: var(--rust);
  text-transform:uppercase;
  letter-spacing:0.06em;
  margin-bottom:10px;
}
.project-card h3{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:18px;
  margin-bottom:10px;
}
.project-card p{
  font-size:14px;
  color: var(--steel);
  line-height:1.6;
}

.hobby-teaser, .cv-section{
  padding: 60px 48px 90px;
  border-top: 1px solid var(--panel-border);
}
.hobby-teaser p, .cv-section p{
  color: var(--steel);
  margin-bottom: 22px;
  max-width: 480px;
}

footer{
  padding: 26px 48px;
  border-top: 1px solid var(--panel-border);
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color: var(--steel);
}

/* PROJECT DETAIL PAGE */
.detail-wrap{ max-width: 900px; margin: 0 auto; padding: 56px 48px 20px; }
.back-link{
  display:inline-block;
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  color: var(--steel);
  margin-bottom: 34px;
}
.back-link:hover{ color: var(--teal); }

.detail-tag{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  color: var(--teal);
  letter-spacing:0.08em;
  text-transform:uppercase;
  margin-bottom:18px;
}
.detail-title{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:42px;
  line-height:1.12;
  margin-bottom:26px;
  max-width: 640px;
}
.detail-long{
  font-size:16.5px;
  line-height:1.75;
  color: var(--steel);
  max-width: 620px;
  margin-bottom: 36px;
}

.detail-stack-label, .detail-related-label{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color: var(--steel);
  text-transform:uppercase;
  letter-spacing:0.08em;
  margin-bottom:12px;
}
.stack-chips{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:36px; }
.chip{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  padding: 7px 14px;
  border: 1px solid var(--panel-border);
  background: var(--panel);
  color: var(--ink);
}

.detail-media{
  border: 1px dashed var(--panel-border);
  background: var(--panel);
  padding: 40px;
  text-align:center;
  color: var(--steel);
  font-family:'IBM Plex Mono', monospace;
  font-size:12.5px;
  margin-bottom: 36px;
}
.detail-media video, .detail-media img{ width:100%; display:block; }

.detail-ctas{ display:flex; gap:16px; margin-bottom: 60px; }

.related-section{ margin-top: 20px; }
.related-section h2{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:20px;
  margin-bottom: 22px;
}

.not-found{
  font-family:'Source Serif 4', serif;
  font-size:17px;
  color: var(--steel);
}

@media (max-width: 860px){
  .detail-wrap{ padding: 40px 24px 20px; }
  .detail-title{ font-size: 32px; }
}

@media (max-width: 860px){
  .hero{ grid-template-columns: 1fr; padding: 60px 24px 40px; }
  h1{ font-size: 38px; }
  nav{ padding: 16px 20px; }
  nav .navlinks{ gap:16px; font-size:10px; }
  .projects, .hobby-teaser, .cv-section{ padding-left:24px; padding-right:24px; }
  .radial-item{ width:120px; }
}

</style>

  function relatedFor(project) {
    const ids = project.related && project.related.length
      ? project.related
      : PROJECTS.filter((p) => p.category === project.category && p.id !== project.id).map((p) => p.id);
    return ids.map((id) => PROJECTS.find((p) => p.id === id)).filter(Boolean);
  }

  function renderNotFound() {
    detailContent.innerHTML = `<p class="not-found">Proje bulunamadı. <a href="index.html#projeler" style="text-decoration:underline;">Proje listesine dön</a>.</p>`;
    relatedGrid.parentElement.style.display = "none";
  }

  function renderProject(project) {
    document.title = project.title[currentLang] + " — Mustafa Ertürk";

    const t = I18N[currentLang];
    const stackChips = project.stack.map((s) => `<span class="chip">${s}</span>`).join("");

    const githubBtn = project.github && project.github !== "#"
      ? `<a href="${project.github}" class="btn" target="_blank" rel="noopener">${t.detail_github}</a>`
      : `<span class="btn ghost" style="opacity:0.5; cursor:default;">${t.detail_soon}</span>`;

    const videoBtn = project.video
      ? `<a href="${project.video}" class="btn ghost" target="_blank" rel="noopener">${t.detail_video}</a>`
      : "";

    const mediaBlock = project.video
      ? `<div class="detail-media"><video src="${project.video}" controls></video></div>`
      : `<div class="detail-media">${t.detail_soon}</div>`;

    detailContent.innerHTML = `
      <div class="detail-tag">${project.tag[currentLang]}</div>
      <h1 class="detail-title">${project.title[currentLang]}</h1>
      <p class="detail-long">${project.long[currentLang]}</p>

      <div class="detail-stack-label">${t.detail_stack}</div>
      <div class="stack-chips">${stackChips}</div>

      ${mediaBlock}

      <div class="detail-ctas">
        ${githubBtn}
        ${videoBtn}
      </div>
    `;

    const related = relatedFor(project);
    relatedGrid.innerHTML = "";
    related.forEach((p) => {
      const card = document.createElement("a");
      card.className = "project-card";
      card.href = "project.html?id=" + encodeURIComponent(p.id);
      card.innerHTML = `
        <div class="pc-tag">${p.tag[currentLang]}</div>
        <h3>${p.title[currentLang]}</h3>
        <p>${p.desc[currentLang]}</p>
      `;
      relatedGrid.appendChild(card);
    });
  }

  function applyStaticTexts() {
    document.documentElement.dataset.lang = currentLang;
    document.documentElement.lang = currentLang;
    langBtn.textContent = currentLang === "tr" ? "EN" : "TR";
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      const key = el.getAttribute("data-i18n");
      if (I18N[currentLang][key]) el.textContent = I18N[currentLang][key];
    });
  }

  function render() {
    applyStaticTexts();
    const project = getProjectFromURL();
    if (!project) {
      renderNotFound();
      return;
    }
    renderProject(project);
  }

  langBtn.addEventListener("click", () => {
    currentLang = currentLang === "tr" ? "en" : "tr";
    localStorage.setItem("lang", currentLang);
    render();
  });

  render();
})();

</script>
</body>
</html>
